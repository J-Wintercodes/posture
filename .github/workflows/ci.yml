name: Build and test

on:
  push:
  pull_request:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and run unit tests
        run: |
          # Simulator names change with every Xcode release, so take the
          # first iPhone the runner actually has.
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}')
          echo "Using simulator $UDID"
          xcodebuild test \
            -project Posture.xcodeproj \
            -scheme Posture \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
